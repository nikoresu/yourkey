<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret — Secret Share</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #e2e8f0;
    }
    header {
      width: 100%;
      padding: 1.25rem 2rem;
      border-bottom: 1px solid #334155;
    }
    header a {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #e2e8f0;
      text-decoration: none;
    }
    header a:hover { color: #a5b4fc; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 2rem;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 560px;
    }
    .card h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    .card p {
      font-size: 1.125rem;
      line-height: 1.6;
      word-break: break-word;
      color: #f1f5f9;
    }
    .card .hint {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #64748b;
    }
    .card .hint a {
      color: #818cf8;
      text-decoration: none;
    }
    .card .hint a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header><a href="/">Secret Share</a></header>
  <main>
    <div class="card">
      <h2>Your secret</h2>
      <p>{{ secret }}</p>
      <p class="hint">This secret has been revealed. <a href="/">Create another</a></p>
    </div>
  </main>
</body>
</html>
