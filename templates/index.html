<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Share</title>
  <script src="https://unpkg.com/htmx.org@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #e2e8f0;
    }
    header {
      width: 100%;
      padding: 1.25rem 2rem;
      border-bottom: 1px solid #334155;
    }
    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 2rem;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 560px;
    }
    .card h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.375rem;
      color: #94a3b8;
    }
    textarea, input[type="number"] {
      width: 100%;
      padding: 0.75rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 0.9375rem;
      font-family: inherit;
    }
    textarea:focus, input[type="number"]:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
    }
    textarea {
      min-height: 120px;
      resize: vertical;
      margin-bottom: 1rem;
    }
    input[type="number"] {
      margin-bottom: 1.5rem;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #4f46e5; }
    #result { margin-top: 1.5rem; }
    #result label { margin-bottom: 0.5rem; }
    #result input {
      width: 100%;
      padding: 0.75rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <header><h1>Secret Share</h1></header>
  <main>
    <div class="card">
      <h2>Create a secret</h2>
      <form hx-post="/create" hx-target="#result" hx-swap="innerHTML">
        <label for="secret">Secret</label>
        <textarea name="secret" id="secret" placeholder="Type your secret here..." required></textarea>
        <label for="max_views">Max views (max {{ max_allowed_views }})</label>
        <input type="number" name="max_views" id="max_views" value="1" min="1" max="{{ max_allowed_views }}">
        <button type="submit">Create link</button>
      </form>
      <div id="result"></div>
    </div>
  </main>
</body>
</html>
